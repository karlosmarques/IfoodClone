services:
  mysql:
    image: mysql:8.0
    container_name: ifood-mysql
    environment:
      MYSQL_ROOT_PASSWORD: karlos24601830
      MYSQL_DATABASE: ifood_java
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Na primeira subida (volume vazio) o MySQL importa os dados da apresentação
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pkarlos24601830"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
